[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqalculate"
version = "5.9.0"
requires-python = ">=3.10"
dependencies = [
    "mpmath>=1.3.0",
    "sympy>=1.13.0",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
qalc = "qalculate.cli:main_entry"

[tool.setuptools.packages.find]
where = ["src"]
